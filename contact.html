<!DOCTYPE html>
<html>
  <head>
    <title>My Portfolio</title>
  </head>
  <body>
    <header>
      <h1>Contact Me</h1>
      <h2>Meseret Getachew</h2>
      <h2>Welcome to My Portfolio</h2>
      <div class="link-row">
      <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About Me</a> | 
            <a href="contact.html">Contact</a>
        </nav>
          <img src="images/download.jpg" alt="Meseret Getachew">
      </div>  
    </header>
    <hr>

    <section>
        <h2>Contact & Feedback Form</h2>
        <form action="#">
            
            <label for="full-name">Full Name:</label><br>
            <input type="text" id="full-name" name="full-name" placeholder="Abebe Beso" required>
            <br><br>

            <label for="experience">Years of Experience in Tech:</label><br>
            <input type="number" id="experience" name="experience" min="0" max="50">
            <br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <label for="satisfaction">How satisfied are you with this portfolio? (1-10):</label><br>
            <input type="range" id="satisfaction" name="satisfaction" min="1" max="10">
            <br><br>

            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">I would like to recive an email update</label>
            <br><br>

            <button type="submit">Submit Feedback</button>
            
            <button type="button" onclick="alert('Button clicked!')">Click Me!</button>
            
            <button type="reset">Clear Form</button>

        </form>
    </section>

    <hr>
    <div>
      <footer>
        <a href="index.html">  Meseret Getachew</a>
      </footer>
    </div>
